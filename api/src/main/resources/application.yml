cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
